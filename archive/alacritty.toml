general.import = ["~/.config/alacritty/themes/themes/afterglow.toml"]

[colors.cursor]
cursor = "0xbc5653"
text = "0x2c2c2c"

[colors.primary]
background = "#2B2A33"  # Same as firefox

[env]
TERM = "alacritty"

[font]
size = 12.0

[[keyboard.bindings]]
action = "ToggleViMode"
key = "Space"
mods = "Control"

[window]
decorations = "full"
title = "Mon Super Terminal (Alacritty)"

[window.dimensions]
columns = 90
lines = 28

[selection]
save_to_clipboard = true

[[mouse.bindings]]
mouse = "Middle"
action = "Paste"
